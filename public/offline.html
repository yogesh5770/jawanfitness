<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Jawan Fitness — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      background: #f4f6fb;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(var(--sat) + 24px) calc(var(--sar) + 20px) calc(var(--sab) + 24px) calc(var(--sal) + 20px);
      text-align: center;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
    }

    .logo img {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .signal-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      filter: grayscale(0.3);
    }

    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #0f172a;
      margin-bottom: 8px;
    }

    h1 span { color: #d97706; }

    p {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #f59e0b, #f59e0b);
      color: #000;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
    }

    .tips {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
    }

    .tips p {
      font-size: 11px;
      color: #475569;
      margin-bottom: 0;
    }

    .cached-note {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 12px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo-3d-tight.png" alt="Jawan Fitness" onerror="this.style.display='none';this.parentElement.innerHTML='💪';" />
    </div>

    <h1>JAWAN <span>FITNESS</span></h1>
    <p>You're offline. Check your internet connection and try again.</p>

    <button class="btn" onclick="tryReload()">
      ↺ &nbsp; Retry Connection
    </button>

    <div class="cached-note">
      💡 Your previously loaded workout data, exercises, and diet plans are still available — just re-open the app when connected.
    </div>

    <div class="tips">
      <p>If this keeps happening, try: Settings → Apps → Jawan Fitness → Clear Cache</p>
    </div>
  </div>

  <script>
    function tryReload() {
      // Attempt to reload the main app; if still offline the SW will serve cached content
      window.location.href = '/';
    }

    // Auto-retry when the browser detects the connection is restored
    window.addEventListener('online', function () {
      window.location.href = '/';
    });
  </script>
</body>
</html>
